# The whole system: `docker compose up` starts Postgres, Redis, Mailpit, the Django API with its
# Celery worker and beat (from backend/docker-compose.yml) and the frontend.
#   docker compose up                    → frontend dev server (Vite) on :5173
#   docker compose --profile prod up     → also the built frontend on nginx, :8080
name: skillproof

include:
  - backend/docker-compose.yml

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    volumes:
      - ./frontend:/app/frontend
      - ./backend/openapi.yaml:/app/backend/openapi.yaml:ro
      - /app/frontend/node_modules
    ports: ["${FRONTEND_HOST_PORT:-5173}:5173"]
    depends_on: [web]

  frontend-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports: ["${FRONTEND_PROD_HOST_PORT:-8080}:8080"]
    depends_on: [web]
