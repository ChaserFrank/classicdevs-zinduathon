<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;background:#f4f4f2;font-family:Arial,Helvetica,sans-serif;color:#1a1a1a">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" style="padding:24px 12px">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:8px">
<tr><td style="padding:20px 24px;border-bottom:1px solid #eee;font-weight:bold;color:#0f766e">SkillProof</td></tr>
<tr><td style="padding:24px;font-size:15px;line-height:1.55">
<p style="margin-top:0">Hi {{ user.full_name|default:"there" }},</p>
{% block content %}{% endblock %}
{% if link %}<p style="margin:24px 0"><a href="{{ link }}" style="background:#0f766e;color:#fff;padding:10px 18px;border-radius:6px;text-decoration:none;display:inline-block">{% block cta %}Open SkillProof{% endblock %}</a></p>{% endif %}
</td></tr>
<tr><td style="padding:16px 24px;border-top:1px solid #eee;font-size:12px;color:#666">You get this email because of your SkillProof notification settings. Change them any time in your account.</td></tr>
</table></td></tr></table></body></html>
