openapi: 3.0.3
info:
  title: SkillProof API
  version: 0.1.0
  description: |-
    SkillProof turns a developer's public GitHub history into an explained skill card: proven skills, a Signal Score built from five rule-based sub-scores, and the evidence behind each number. Recruiters search and give feedback; job seekers receive it in-app, by email and by SMS.

    Conventions: JSON with camelCase keys, `Authorization: Bearer <access token>`, page-number pagination (`?page=&pageSize=`), errors shaped `{code, message, fields?}`.
paths:
  /api/v1/auth/email/resend:
    post:
      operationId: auth_email_resend_create
      summary: Resend the verification email
      tags:
      - Auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotAuthenticated:
                  value:
                    code: not_authenticated
                    message: …
                  summary: not_authenticated
          description: 'Not signed in or token invalid: `not_authenticated`'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                RateLimited:
                  value:
                    code: rate_limited
                    message: …
                  summary: rate_limited
          description: 'Too many requests: `rate_limited`'
  /api/v1/auth/email/verify:
    post:
      operationId: auth_email_verify_create
      description: Posts the token from the emailed link. Idempotent.
      summary: Verify email
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                TokenInvalid:
                  value:
                    code: token_invalid
                    message: …
                  summary: token_invalid
          description: 'Bad request: `token_invalid`'
  /api/v1/auth/github:
    delete:
      operationId: auth_github_destroy
      description: Refused when the account has no password (you would be locked out).
      summary: Unlink GitHub
      tags:
      - Auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                GithubNotLinked:
                  value:
                    code: github_not_linked
                    message: …
                  summary: github_not_linked
          description: 'Bad request: `github_not_linked`'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PasswordRequired:
                  value:
                    code: password_required
                    message: …
                  summary: password_required
          description: 'Conflict: `password_required`'
  /api/v1/auth/github/authorize:
    get:
      operationId: auth_github_authorize_retrieve
      description: Returns the GitHub URL to send the browser to, with a signed `state`
        (10 minutes). Keep `state` in sessionStorage and compare it on the callback
        page.
      summary: Start GitHub sign-in
      parameters:
      - in: query
        name: acceptTerms
        schema:
          type: boolean
        description: Required true for a first-time GitHub sign-up.
      - in: query
        name: emailFeedback
        schema:
          type: boolean
      - in: query
        name: link
        schema:
          type: boolean
        description: True when linking GitHub to the signed-in account from settings.
      - in: query
        name: role
        schema:
          type: string
          enum:
          - job_seeker
          - recruiter
        description: For new sign-ups. Default job_seeker. Recruiters can only link.
      - in: query
        name: smsFeedback
        schema:
          type: boolean
      tags:
      - Auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubAuthorizeResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                GithubNotConfigured:
                  value:
                    code: github_not_configured
                    message: …
                  summary: github_not_configured
          description: 'Dependency unavailable: `github_not_configured`'
  /api/v1/auth/github/callback:
    post:
      operationId: auth_github_callback_create
      description: Exchanges GitHub's `code`. Known GitHub account → signs in. Signed-in
        caller → links GitHub to them. Matching verified email → links and signs in.
        Otherwise creates a job seeker (requires `acceptTerms` at authorize time).
        Stores the GitHub token encrypted.
      summary: Finish GitHub sign-in
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GithubCallbackRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GithubCallbackRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GithubCallbackRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubAuthResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                StateInvalid:
                  value:
                    code: state_invalid
                    message: …
                  summary: state_invalid
                GithubOauthFailed:
                  value:
                    code: github_oauth_failed
                    message: …
                  summary: github_oauth_failed
                GithubEmailUnverified:
                  value:
                    code: github_email_unverified
                    message: …
                  summary: github_email_unverified
                TermsRequired:
                  value:
                    code: terms_required
                    message: …
                  summary: terms_required
                RecruiterSignupRequiresEmail:
                  value:
                    code: recruiter_signup_requires_email
                    message: …
                  summary: recruiter_signup_requires_email
          description: 'Bad request: `state_invalid`, `github_oauth_failed`, `github_email_unverified`,
            `terms_required`, `recruiter_signup_requires_email`'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                GithubAlreadyLinked:
                  value:
                    code: github_already_linked
                    message: …
                  summary: github_already_linked
          description: 'Conflict: `github_already_linked`'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                GithubNotConfigured:
                  value:
                    code: github_not_configured
                    message: …
                  summary: github_not_configured
          description: 'Dependency unavailable: `github_not_configured`'
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      description: Throttled to 5 attempts per minute per IP and email.
      summary: Sign in with email and password
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              Credentials:
                value:
                  email: wanjiru@example.com
                  password: correct-horse-battery
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                SignedIn:
                  value:
                    access: eyJhbGciOi…
                    refresh: eyJhbGciOi…
                    user:
                      id: 6f1c7a2e-4c9b-4d1f-9a0e-2b8f1d3c5e7a
                      email: wanjiru@example.com
                      role: job_seeker
                      fullName: Wanjiru Kamau
                      phone: '+254712345678'
                      emailVerified: true
                      phoneVerified: false
                      hasPassword: true
                      dateJoined: '2026-11-07T10:00:00+03:00'
                      github:
                        login: wanjiru-dev
                        avatarUrl: https://avatars.githubusercontent.com/u/1
                        connectedAt: '2026-11-07T10:05:00+03:00'
                      jobSeekerProfile:
                        headline: Full-stack developer
                        location: Nairobi
                        cardVisible: true
                        openToWork: true
                      recruiterProfile: null
                  summary: Signed in
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ValidationError:
                  value:
                    code: validation_error
                    message: …
                  summary: validation_error
          description: 'Bad request: `validation_error`'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                InvalidCredentials:
                  value:
                    code: invalid_credentials
                    message: …
                  summary: invalid_credentials
          description: 'Not signed in or token invalid: `invalid_credentials`'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                RateLimited:
                  value:
                    code: rate_limited
                    message: …
                  summary: rate_limited
          description: 'Too many requests: `rate_limited`'
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      description: Blacklists the given refresh token. The access token expires on
        its own.
      summary: Sign out
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ValidationError:
                  value:
                    code: validation_error
                    message: …
                  summary: validation_error
          description: 'Bad request: `validation_error`'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                TokenInvalid:
                  value:
                    code: token_invalid
                    message: …
                  summary: token_invalid
          description: 'Not signed in or token invalid: `token_invalid`'
  /api/v1/auth/password/change:
    post:
      operationId: auth_password_change_create
      description: Requires the current password, except for GitHub-only accounts
        setting their first password. Signs out other devices and returns a fresh
        token pair.
      summary: Change password
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ValidationError:
                  value:
                    code: validation_error
                    message: …
                  summary: validation_error
          description: 'Bad request: `validation_error`'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotAuthenticated:
                  value:
                    code: not_authenticated
                    message: …
                  summary: not_authenticated
          description: 'Not signed in or token invalid: `not_authenticated`'
  /api/v1/auth/password/reset:
    post:
      operationId: auth_password_reset_create
      description: Always answers 204, whether or not the email exists (no account
        enumeration).
      summary: Request a password reset email
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ValidationError:
                  value:
                    code: validation_error
                    message: …
                  summary: validation_error
          description: 'Bad request: `validation_error`'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                RateLimited:
                  value:
                    code: rate_limited
                    message: …
                  summary: rate_limited
          description: 'Too many requests: `rate_limited`'
  /api/v1/auth/password/reset/confirm:
    post:
      operationId: auth_password_reset_confirm_create
      description: The link works once and for 1 hour. Signs the user out everywhere.
      summary: Set a new password from a reset link
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                TokenInvalid:
                  value:
                    code: token_invalid
                    message: …
                  summary: token_invalid
                ValidationError:
                  value:
                    code: validation_error
                    message: …
                  summary: validation_error
          description: 'Bad request: `token_invalid`, `validation_error`'
  /api/v1/auth/phone/send-code:
    post:
      operationId: auth_phone_send_code_create
      description: 'Optionally sets/changes the phone first (Kenyan formats accepted:
        07…, 01…, +254…, 254…). Sends a 6-digit code valid for 10 minutes. Throttled
        to 3 per hour. While SMS is in dry-run mode in local development, the response
        includes `devCode`.'
      summary: Send a phone verification code by SMS
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneSendCodeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PhoneSendCodeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhoneSendCodeRequest'
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneSendCodeResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ValidationError:
                  value:
                    code: validation_error
                    message: …
                  summary: validation_error
                PhoneMissing:
                  value:
                    code: phone_missing
                    message: …
                  summary: phone_missing
          description: 'Bad request: `validation_error`, `phone_missing`'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                RateLimited:
                  value:
                    code: rate_limited
                    message: …
                  summary: rate_limited
          description: 'Too many requests: `rate_limited`'
  /api/v1/auth/phone/verify:
    post:
      operationId: auth_phone_verify_create
      description: Five wrong attempts invalidate the code.
      summary: Verify the phone with the SMS code
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PhoneVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhoneVerifyRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                CodeInvalid:
                  value:
                    code: code_invalid
                    message: …
                  summary: code_invalid
                ValidationError:
                  value:
                    code: validation_error
                    message: …
                  summary: validation_error
          description: 'Bad request: `code_invalid`, `validation_error`'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                CodeAttemptsExceeded:
                  value:
                    code: code_attempts_exceeded
                    message: …
                  summary: code_attempts_exceeded
          description: 'Too many requests: `code_attempts_exceeded`'
  /api/v1/auth/register:
    post:
      operationId: auth_register_create
      description: Creates a job seeker or recruiter (recruiters start `pending` until
        an admin approves them) and emails a verification link. `consents.terms` must
        be true. A phone number is required when `consents.smsFeedback` is true. Returns
        tokens and the user.
      summary: Register with email and password
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              JobSeeker:
                value:
                  email: wanjiru@example.com
                  password: correct-horse-battery
                  role: job_seeker
                  fullName: Wanjiru Kamau
                  phone: 0712345678
                  consents:
                    terms: true
                    emailFeedback: true
                    smsFeedback: true
                summary: Job seeker
              Recruiter:
                value:
                  email: otieno@acme.co.ke
                  password: correct-horse-battery
                  role: recruiter
                  fullName: Brian Otieno
                  companyName: Acme Kenya
                  jobTitle: Talent lead
                  consents:
                    terms: true
                    emailFeedback: true
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                SignedIn:
                  value:
                    access: eyJhbGciOi…
                    refresh: eyJhbGciOi…
                    user:
                      id: 6f1c7a2e-4c9b-4d1f-9a0e-2b8f1d3c5e7a
                      email: wanjiru@example.com
                      role: job_seeker
                      fullName: Wanjiru Kamau
                      phone: '+254712345678'
                      emailVerified: true
                      phoneVerified: false
                      hasPassword: true
                      dateJoined: '2026-11-07T10:00:00+03:00'
                      github:
                        login: wanjiru-dev
                        avatarUrl: https://avatars.githubusercontent.com/u/1
                        connectedAt: '2026-11-07T10:05:00+03:00'
                      jobSeekerProfile:
                        headline: Full-stack developer
                        location: Nairobi
                        cardVisible: true
                        openToWork: true
                      recruiterProfile: null
                  summary: Signed in
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ValidationError:
                  value:
                    code: validation_error
                    message: …
                  summary: validation_error
          description: 'Bad request: `validation_error`'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                RateLimited:
                  value:
                    code: rate_limited
                    message: …
                  summary: rate_limited
          description: 'Too many requests: `rate_limited`'
  /api/v1/auth/token/refresh:
    post:
      operationId: auth_token_refresh_create
      description: Exchanges a refresh token for a new access token **and** a new
        refresh token. The old refresh token is blacklisted (rotation), so each refresh
        token works once. Claims (role, approval status, GitHub login) are re-read
        from the database.
      summary: Refresh tokens
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ValidationError:
                  value:
                    code: validation_error
                    message: …
                  summary: validation_error
          description: 'Bad request: `validation_error`'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                TokenInvalid:
                  value:
                    code: token_invalid
                    message: …
                  summary: token_invalid
          description: 'Not signed in or token invalid: `token_invalid`'
  /api/v1/health:
    get:
      operationId: health_retrieve
      description: Checks PostgreSQL and Redis. Returns 200 when both answer, 503
        otherwise, plus the running version and commit so you can confirm what is
        deployed.
      summary: Health check
      tags:
      - System
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                Healthy:
                  value:
                    status: ok
                    checks:
                      database: ok
                      redis: ok
                    version: 0.1.0
                    commitSha: 59739f0
                    time: '2026-11-07T10:00:00+03:00'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/me:
    get:
      operationId: me_retrieve
      summary: Current user
      tags:
      - Profile
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                JobSeeker:
                  value:
                    id: 6f1c7a2e-4c9b-4d1f-9a0e-2b8f1d3c5e7a
                    email: wanjiru@example.com
                    role: job_seeker
                    fullName: Wanjiru Kamau
                    phone: '+254712345678'
                    emailVerified: true
                    phoneVerified: false
                    hasPassword: true
                    dateJoined: '2026-11-07T10:00:00+03:00'
                    github:
                      login: wanjiru-dev
                      avatarUrl: https://avatars.githubusercontent.com/u/1
                      connectedAt: '2026-11-07T10:05:00+03:00'
                    jobSeekerProfile:
                      headline: Full-stack developer
                      location: Nairobi
                      cardVisible: true
                      openToWork: true
                    recruiterProfile: null
                  summary: Job seeker
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotAuthenticated:
                  value:
                    code: not_authenticated
                    message: …
                  summary: not_authenticated
          description: 'Not signed in or token invalid: `not_authenticated`'
    patch:
      operationId: me_partial_update
      description: 'Flat body. Job seekers: fullName, phone, headline, location, cardVisible,
        openToWork. Recruiters: fullName, phone, jobTitle. Changing the phone marks
        it unverified.'
      summary: Update profile
      tags:
      - Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
            examples:
              HideCard:
                value:
                  cardVisible: false
                  headline: Backend dev
                summary: Hide card
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ValidationError:
                  value:
                    code: validation_error
                    message: …
                  summary: validation_error
          description: 'Bad request: `validation_error`'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotAuthenticated:
                  value:
                    code: not_authenticated
                    message: …
                  summary: not_authenticated
          description: 'Not signed in or token invalid: `not_authenticated`'
components:
  schemas:
    ApprovalStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      - suspended
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
        * `suspended` - Suspended
    AuthResponse:
      type: object
      description: Same shape from register, login and the GitHub callback.
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/Me'
      required:
      - access
      - refresh
      - user
    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        website:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        location:
          type: string
          maxLength: 120
        isVerified:
          type: boolean
      required:
      - id
      - name
    ConsentsRequest:
      type: object
      properties:
        terms:
          type: boolean
          description: Terms of service and privacy policy. Must be true.
        emailFeedback:
          type: boolean
          default: false
        smsFeedback:
          type: boolean
          default: false
      required:
      - terms
    DependencyStatusEnum:
      enum:
      - ok
      - down
      type: string
      description: |-
        * `ok` - ok
        * `down` - down
    EmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    Error:
      type: object
      description: The error shape every endpoint returns (documented once, referenced
        everywhere).
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. `not_found`.
        message:
          type: string
          description: Human-readable sentence safe to show users.
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Validation errors per field (only when code is `validation_error`).
      required:
      - code
      - message
    GithubAccount:
      type: object
      properties:
        login:
          type: string
          description: Lowercase GitHub login
          maxLength: 39
        avatarUrl:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        connectedAt:
          type: string
          format: date-time
      required:
      - login
    GithubAuthResponse:
      type: object
      description: Same shape from register, login and the GitHub callback.
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/Me'
        created:
          type: boolean
          description: True when this sign-in created a new account.
      required:
      - access
      - created
      - refresh
      - user
    GithubAuthorizeResponse:
      type: object
      properties:
        authorizeUrl:
          type: string
          format: uri
        state:
          type: string
      required:
      - authorizeUrl
      - state
    GithubCallbackRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
      required:
      - code
      - state
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
        checks:
          $ref: '#/components/schemas/HealthChecks'
        version:
          type: string
        commitSha:
          type: string
        time:
          type: string
          format: date-time
      required:
      - checks
      - commitSha
      - status
      - time
      - version
    HealthChecks:
      type: object
      properties:
        database:
          $ref: '#/components/schemas/DependencyStatusEnum'
        redis:
          $ref: '#/components/schemas/DependencyStatusEnum'
      required:
      - database
      - redis
    HealthStatusEnum:
      enum:
      - ok
      - degraded
      type: string
      description: |-
        * `ok` - ok
        * `degraded` - degraded
    JobSeekerProfile:
      type: object
      properties:
        headline:
          type: string
          maxLength: 160
        location:
          type: string
          maxLength: 120
        cardVisible:
          type: boolean
          description: Recruiters can find and view this card.
        openToWork:
          type: boolean
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    Me:
      type: object
      description: What the frontend needs after sign-in to route and render the account
        menu.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: '#/components/schemas/MeRoleEnum'
        fullName:
          type: string
          maxLength: 150
        phone:
          type: string
          nullable: true
          description: E.164, e.g. +254712345678
          maxLength: 16
        emailVerified:
          type: boolean
          readOnly: true
        phoneVerified:
          type: boolean
          readOnly: true
        hasPassword:
          type: boolean
          readOnly: true
        dateJoined:
          type: string
          format: date-time
        github:
          allOf:
          - $ref: '#/components/schemas/GithubAccount'
          nullable: true
          readOnly: true
        jobSeekerProfile:
          allOf:
          - $ref: '#/components/schemas/JobSeekerProfile'
          nullable: true
          readOnly: true
        recruiterProfile:
          allOf:
          - $ref: '#/components/schemas/RecruiterProfile'
          nullable: true
          readOnly: true
      required:
      - email
      - emailVerified
      - github
      - hasPassword
      - id
      - jobSeekerProfile
      - phoneVerified
      - recruiterProfile
    MeRoleEnum:
      enum:
      - job_seeker
      - recruiter
      - admin
      type: string
      description: |-
        * `job_seeker` - Job seeker
        * `recruiter` - Recruiter
        * `admin` - Admin
    PasswordChangeRequest:
      type: object
      properties:
        currentPassword:
          type: string
          writeOnly: true
        newPassword:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - newPassword
    PasswordResetConfirmRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
        newPassword:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - newPassword
      - token
    PatchedMeUpdateRequest:
      type: object
      description: Flat PATCH body; fields are routed to the user or the role profile.
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          nullable: true
        headline:
          type: string
          maxLength: 160
        location:
          type: string
          maxLength: 120
        cardVisible:
          type: boolean
        openToWork:
          type: boolean
        jobTitle:
          type: string
          maxLength: 120
    PhoneSendCodeRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
          description: 'Optional: set or change the number before sending the code.'
    PhoneSendCodeResponse:
      type: object
      properties:
        phone:
          type: string
        expiresAt:
          type: string
          format: date-time
        devCode:
          type: string
          description: Only in local development while SMS is dry-run.
      required:
      - expiresAt
      - phone
    PhoneVerifyRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          pattern: ^\s*\d{6}\s*$
      required:
      - code
    RecruiterProfile:
      type: object
      properties:
        company:
          $ref: '#/components/schemas/Company'
        jobTitle:
          type: string
          maxLength: 120
        approvalStatus:
          $ref: '#/components/schemas/ApprovalStatusEnum'
        reviewNote:
          type: string
          maxLength: 500
        reviewedAt:
          type: string
          format: date-time
          nullable: true
      required:
      - company
    RefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        role:
          $ref: '#/components/schemas/RegisterRoleEnum'
        fullName:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          nullable: true
        companyName:
          type: string
          maxLength: 120
        jobTitle:
          type: string
          maxLength: 120
        consents:
          $ref: '#/components/schemas/ConsentsRequest'
      required:
      - consents
      - email
      - fullName
      - password
      - role
    RegisterRoleEnum:
      enum:
      - job_seeker
      - recruiter
      type: string
      description: |-
        * `job_seeker` - job_seeker
        * `recruiter` - recruiter
    TokenPair:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          description: The token from the emailed link.
      required:
      - token
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: System
  description: Health and version
- name: Auth
  description: Registration, sign-in, tokens, GitHub OAuth
- name: Profile
  description: The signed-in user's own data
- name: Analyses
  description: Run and read GitHub analyses and skill cards
- name: Skills
  description: Skill catalogue
- name: Candidates
  description: Recruiter search over job seekers
- name: Jobs
  description: Job postings and match scores
- name: Shortlists
  description: Recruiter shortlists
- name: Feedback
  description: Recruiter feedback to job seekers
- name: Notifications
  description: In-app inbox and preferences
- name: Admin
  description: Admin-only management API
