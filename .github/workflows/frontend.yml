name: frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", "backend/openapi.yaml", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "backend/openapi.yaml", ".github/workflows/frontend.yml"]

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types match backend/openapi.yaml
        run: npm run api:types:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Build
        run: npx vite build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -f frontend/Dockerfile --target prod -t skillproof-frontend:ci .
